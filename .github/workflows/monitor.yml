name: PBC Announcement Monitor

on:
  schedule:
    # UTC 00:00 - 13:00 对应北京时间 08:00 - 21:00，每小时触发一次
    - cron: "0 0-13 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Random delay for scheduled runs
        if: github.event_name == 'schedule'
        run: |
          DELAY=$(shuf -i 60-480 -n 1)
          echo "随机等待 ${DELAY} 秒后开始抓取..."
          sleep $DELAY

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies and Chromium
        run: |
          pip install -r requirements.txt
          playwright install chromium
          playwright install-deps chromium

      - name: Run monitor script
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          RECEIVER_EMAIL: ${{ secrets.RECEIVER_EMAIL }}
        run: python monitor.py

      - name: Commit updated history
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add pbc_seen.json
          git diff --staged --quiet || (git commit -m "chore: update seen announcements" && git push)
